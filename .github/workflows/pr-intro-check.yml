name: PR Intro Check

on:
  pull_request:
    branches: [main]

jobs:
  validate-intro:
    name: Validate student introduction
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find changed student files
        id: changed
        run: |
          git fetch origin main --depth=1
          FILES=$(git diff --name-only origin/main...HEAD -- 'students/*.md' | grep -v 'template.md' || true)
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Check required fields are filled in
        run: |
          PASS=true
          FILES="${{ steps.changed.outputs.files }}"

          if [ -z "$FILES" ]; then
            echo "No student intro files changed — skipping field check."
            exit 0
          fi

          REQUIRED_FIELDS=(
            "姓名 / 綽號"
            "大學畢業校系"
            "最常寫的程式語言"
            "進實驗室最想學到的一個技術"
            "一句想說的話"
          )

          for FILE in $FILES; do
            echo "=== Checking $FILE ==="
            for FIELD in "${REQUIRED_FIELDS[@]}"; do
              # The line must contain the field AND have content after the colon
              LINE=$(grep "$FIELD" "$FILE" || true)
              VALUE=$(echo "$LINE" | sed 's/.*：//' | tr -d '[:space:]')
              if [ -z "$VALUE" ]; then
                echo "❌  Missing or empty: $FIELD"
                PASS=false
              else
                echo "✅  $FIELD: $VALUE"
              fi
            done
          done

          if [ "$PASS" = false ]; then
            echo ""
            echo "請填寫 students/<學號>.md 中所有必填欄位後再提交 PR。"
            exit 1
          fi

      - name: Check file is not named template.md
        run: |
          if git diff --name-only origin/main...HEAD -- 'students/*.md' | grep -q 'template.md'; then
            echo "❌  請勿直接修改 students/template.md，請複製為自己的學號.md"
            exit 1
          fi
          echo "✅  File naming check passed"
